name: API Unit-Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "ASP.Net/**"
      - ".github/workflows/test-api.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ASP.Net/**"

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Nur die Unit-Tests laufen hier automatisch: sie sind komplett gemockt (Moq)
      # und brauchen keine echte Datenbankverbindung. Integrations- und Systemtests
      # laufen gegen die echte Neon-DB (siehe FillDbAsync) und werden bewusst NICHT
      # bei jedem Push automatisch ausgeführt, um Produktivdaten nicht zu gefährden -
      # die laufen lokal (Rider/`dotnet test`) vor einem Merge.
      #
      # Filter nach [TestCategory("Unit")] statt Namespace (FullyQualifiedName~UnitTests):
      # der Namespace-Filter wurde von der Test-Plattform stillschweigend ignoriert und
      # hat alle 31 Tests laufen lassen statt nur die 14 Unit-Tests - TestCategory ist
      # der zuverlässige Weg.
      - name: Unit-Tests ausführen
        run: dotnet test ASP.Net/WebApiTest/WebApiTest.csproj --filter "TestCategory=Unit"
