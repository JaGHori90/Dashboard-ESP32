name: API Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "ASP.Net/**"
      - ".github/workflows/test-api.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ASP.Net/**"

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Kein --filter mehr: dotnet test --filter wurde von der Test-Plattform
      # (Microsoft.Testing.Platform, über MSTest.Sdk) hier zuverlässig ignoriert,
      # egal welche Query-Syntax (FullyQualifiedName~X, TestCategory=X) benutzt wurde -
      # es liefen immer alle 31 Tests statt der gewünschten Teilmenge.
      #
      # Stattdessen laufen jetzt immer ALLE Tests, aber die Integrations-/Systemtests
      # (echte Neon-DB) erkennen selbst, wenn kein Connection String konfiguriert ist
      # (siehe WebApiTest/TestDb.cs), und melden sich als "Inconclusive" statt
      # fehlzuschlagen. Die Unit-Tests (Moq, keine DB) laufen echt und bestimmen den
      # Build-Status.
      - name: Tests ausführen
        run: dotnet test ASP.Net/WebApiTest/WebApiTest.csproj
