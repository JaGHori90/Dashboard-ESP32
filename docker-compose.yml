services:
  postgres:
    image: postgres:16
    container_name: dashboard-esp32-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sensordata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
